name: Update Nook screen

on:
  schedule:
    - cron: "17 * * * *"    # off-peak minute, every hour
  workflow_dispatch:            # lets you run it manually from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow requests
      - run: python generate.py
        env:
          LAT: ${{ secrets.LAT }}
          LON: ${{ secrets.LON }}
          TZ: ${{ secrets.TZ }}
          CITY: ${{ secrets.CITY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
